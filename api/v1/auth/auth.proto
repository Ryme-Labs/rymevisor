syntax = "proto3";

package rymevalor.api.v1.auth;

option go_package = "github.com/rymelabs/rymevisor/gen/go/rymevisor/api/v1/authpb";

import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  UserStatus status = 4;
  repeated string roles = 5;
  repeated string organizations = 6;
  bool mfa_enabled = 7;
  google.protobuf.Timestamp last_login_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_DELETED = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  User user = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  repeated string roles = 4;
  string organization_id = 5;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 per_page = 2;
  string organization_id = 3;
  UserStatus status = 4;
  string search = 5;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
  UserStatus status = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message CreateAPIKeyRequest {
  string name = 1;
  string description = 2;
  string organization_id = 3;
  repeated string permissions = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated string allowed_ips = 6;
}

message CreateAPIKeyResponse {
  APIKey api_key = 1;
  string secret = 2;
}

message APIKey {
  string id = 1;
  string name = 2;
  string description = 3;
  string prefix = 4;
  string organization_id = 5;
  repeated string permissions = 6;
  repeated string allowed_ips = 7;
  bool active = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp last_used_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListAPIKeysRequest {
  string organization_id = 1;
}

message ListAPIKeysResponse {
  repeated APIKey api_keys = 1;
}

message RevokeAPIKeyRequest {
  string id = 1;
}

message RevokeAPIKeyResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  repeated string permissions = 2;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message SetupTOTPRequest {}

message SetupTOTPResponse {
  string secret = 1;
  string qr_code_url = 2;
}

message VerifyTOTPRequest {
  string code = 1;
}

message VerifyTOTPResponse {
  bool verified = 1;
}

message CreateRecoveryCodesRequest {}

message CreateRecoveryCodesResponse {
  repeated string codes = 1;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc SetupTOTP(SetupTOTPRequest) returns (SetupTOTPResponse);
  rpc VerifyTOTP(VerifyTOTPRequest) returns (VerifyTOTPResponse);
  rpc CreateRecoveryCodes(CreateRecoveryCodesRequest) returns (CreateRecoveryCodesResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
}
