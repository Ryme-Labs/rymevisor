services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rymevisor
      POSTGRES_PASSWORD: rymevisor
      POSTGRES_DB: rymevisor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rymevisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm=/data"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE: control-plane
    ports:
      - "8080:8080"
    environment:
      RYMEVISOR_SERVER_ADDR: ":8080"
      RYMEVISOR_DATABASE_URL: "postgres://rymevisor:rymevisor@postgres:5432/rymevisor?sslmode=disable"
      RYMEVISOR_NATS_URL: "nats://nats:4222"
      RYMEVISOR_REDIS_ADDR: "redis:6379"
      RYMEVISOR_JWT_SECRET: "dev-secret-change-in-production"
      RYMEVISOR_LOG_LEVEL: "debug"
      RYMEVISOR_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    ports:
      - "8081:8080"
    environment:
      RYMEVISOR_SERVER_ADDR: ":8080"
      RYMEVISOR_DATABASE_URL: "postgres://rymevisor:rymevisor@postgres:5432/rymevisor?sslmode=disable"
      RYMEVISOR_NATS_URL: "nats://nats:4222"
      RYMEVISOR_JWT_SECRET: "dev-secret-change-in-production"
      RYMEVISOR_LOG_LEVEL: "debug"
      RYMEVISOR_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  auth-service:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE: auth-service
    ports:
      - "8082:8080"
    environment:
      RYMEVISOR_SERVER_ADDR: ":8080"
      RYMEVISOR_DATABASE_URL: "postgres://rymevisor:rymevisor@postgres:5432/rymevisor?sslmode=disable"
      RYMEVISOR_JWT_SECRET: "dev-secret-change-in-production"
      RYMEVISOR_LOG_LEVEL: "debug"
      RYMEVISOR_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE: scheduler
    ports:
      - "8083:8080"
    environment:
      RYMEVISOR_SERVER_ADDR: ":8080"
      RYMEVISOR_DATABASE_URL: "postgres://rymevisor:rymevisor@postgres:5432/rymevisor?sslmode=disable"
      RYMEVISOR_NATS_URL: "nats://nats:4222"
      RYMEVISOR_LOG_LEVEL: "debug"
      RYMEVISOR_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  networking-engine:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE: networking-engine
    ports:
      - "8084:8080"
    environment:
      RYMEVISOR_SERVER_ADDR: ":8080"
      RYMEVISOR_DATABASE_URL: "postgres://rymevisor:rymevisor@postgres:5432/rymevisor?sslmode=disable"
      RYMEVISOR_LOG_LEVEL: "debug"
      RYMEVISOR_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy

  storage-manager:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE: storage-manager
    ports:
      - "8085:8080"
    environment:
      RYMEVISOR_SERVER_ADDR: ":8080"
      RYMEVISOR_DATABASE_URL: "postgres://rymevisor:rymevisor@postgres:5432/rymevisor?sslmode=disable"
      RYMEVISOR_LOG_LEVEL: "debug"
      RYMEVISOR_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
