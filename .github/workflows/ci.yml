name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
      bump:
        description: 'Auto bump version'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rymevalor
          POSTGRES_PASSWORD: rymevalor
          POSTGRES_DB: rymevalor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rymevalor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10
        ports: ['4222:4222']
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          RYMEVISOR_DATABASE_URL: postgres://rymevisor:rymevisor@localhost:5432/rymevisor?sslmode=disable
          RYMEVISOR_NATS_URL: nats://localhost:4222
          RYMEVISOR_REDIS_ADDR: localhost:6379
          RYMEVISOR_JWT_SECRET: test-secret

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all services
        run: |
          SERVICES="control-plane api-gateway auth-service scheduler networking-engine storage-manager node-agent"
          for svc in $SERVICES; do
            echo "Building ${svc}..."
            CGO_ENABLED=0 go build -o /dev/null "./cmd/${svc}"
          done

      - name: Vet
        run: go vet ./...

  version:
    name: Determine Version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Manual override takes priority
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "## Version: ${VERSION}" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Get latest tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No tags yet, start at v0.1.0
            VERSION="v0.1.0"
          else
            # Auto-bump patch from latest tag
            CURRENT=$(echo "$LATEST_TAG" | sed 's/^v//')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Check if this exact tag already exists
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping release"
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "version=${VERSION}-skip" >> $GITHUB_OUTPUT
          else
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

          echo "## Version: ${VERSION}" >> $GITHUB_STEP_SUMMARY

  release-build:
    name: Build Release ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          SERVICES="control-plane api-gateway auth-service scheduler networking-engine storage-manager node-agent"
          for svc in $SERVICES; do
            echo "Building ${svc}..."
            go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.version }}" \
              -o "dist/${svc}-${{ matrix.goos }}-${{ matrix.goarch }}" \
              "./cmd/${svc}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  release:
    name: Create Release
    needs: [version, release-build]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          echo "## Changes" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$CHANGES" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Installation" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "curl -fsSL https://raw.githubusercontent.com/Ryme-Labs/rymevisor/main/install.sh | sudo bash" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "RymeVisor ${{ needs.version.outputs.version }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/control-plane-*
            dist/api-gateway-*
            dist/auth-service-*
            dist/scheduler-*
            dist/networking-engine-*
            dist/storage-manager-*
            dist/node-agent-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
