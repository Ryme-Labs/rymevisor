name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rymevalor
          POSTGRES_PASSWORD: rymevalor
          POSTGRES_DB: rymevalor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rymevalor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10
        ports: ['4222:4222']
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          RYMEVISOR_DATABASE_URL: postgres://rymevisor:rymevisor@localhost:5432/rymevisor?sslmode=disable
          RYMEVISOR_NATS_URL: nats://localhost:4222
          RYMEVISOR_REDIS_ADDR: localhost:6379
          RYMEVISOR_JWT_SECRET: test-secret

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all services
        run: |
          SERVICES="control-plane api-gateway auth-service scheduler networking-engine storage-manager node-agent"
          for svc in $SERVICES; do
            echo "Building ${svc}..."
            CGO_ENABLED=0 go build -o /dev/null "./cmd/${svc}"
          done

      - name: Vet
        run: go vet ./...
