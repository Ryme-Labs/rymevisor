name: Install Script Test

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'

jobs:
  test-install:
    name: Test install.sh
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - name: Test install script syntax
        run: bash -n install.sh

      - name: Test install (dry run)
        run: |
          # Test that the script can be parsed and basic functions work
          bash -c 'source install.sh; log_info "test"; generate_password' || true
